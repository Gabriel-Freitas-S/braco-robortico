[package]
name = "robocontrol"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.33"
egui = "0.33"
serialport = "4.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTPS com rustls (roots embutidas): sem OpenSSL no AppImage e sem
# framework de rede extra no Windows/macOS.
ureq = { version = "2", default-features = false, features = ["tls"] }
